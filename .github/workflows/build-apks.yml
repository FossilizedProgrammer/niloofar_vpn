name: Build APKs

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apks:
    name: Release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform and build-tools
        run: |
          # The runner image already ships the SDK, so only the platform and
          # build-tools this project compiles against are added. sdkmanager is
          # located by glob because its cmdline-tools directory is versioned.
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          if [ -z "$SDKM" ]; then
            echo "::warning::no sdkmanager on the image, using the SDK as-is"
            exit 0
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APKs
        run: |
          chmod +x gradlew tools/build-apks.sh
          GRADLE=./gradlew ./tools/build-apks.sh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NiloofarVPN-apks
          path: dist/*.apk
          if-no-files-found: error
