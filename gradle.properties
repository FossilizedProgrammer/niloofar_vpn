org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Dependencies come from the mirrors in settings.gradle.kts; Google's own host
# 404s from here. Builds also pass -DsocksProxyHost= to skip the SOCKS proxy
# configured in ~/.gradle/gradle.properties, which rejects Java's requests.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=600000
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.enableR8.fullMode=true
